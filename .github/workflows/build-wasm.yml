name: Build WASM Modules

on:
  push:
    branches: [main]
    paths:
      - 'circuits/**'
      - 'scripts/build-*.sh'
      - '.github/workflows/build-wasm.yml'
  workflow_dispatch:
    inputs:
      skip_noir:
        description: 'Skip Noir compilation (use when nargo version mismatches)'
        type: boolean
        default: false
      deploy_to_cf:
        description: 'Deploy worker scripts to Cloudflare'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      # ── Build Monero WASM ──────────────────────────────
      - name: Install wasm-pack
        run: |
          curl -sSf https://wasm-pack.initiative.sh/install.sh | sh
          wasm-pack --version

      - name: Build Monero WASM
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/monero-ecosystem/monero-javascript.git /tmp/monero-js
          cd /tmp/monero-js
          npm install --silent
          rustup target add wasm32-unknown-unknown 2>/dev/null || true
          npx wasm-pack build --target web 2>&1
          mkdir -p $GITHUB_WORKSPACE/dist/wasm
          cp pkg/monero_wasm.wasm $GITHUB_WORKSPACE/dist/wasm/ 2>/dev/null || true
          cp pkg/monero_wasm_bg.wasm $GITHUB_WORKSPACE/dist/wasm/ 2>/dev/null || true

      # ── Build Noir ZK Circuit (optional) ───────────────
      - name: Install nargo
        if: ${{ !inputs.skip_noir }}
        continue-on-error: true
        run: |
          # Try to install nargo via cargo-binstall or from source
          cargo install cargo-binstall 2>/dev/null || true
          cargo binstall nargo --version "0.36.0" -y 2>/dev/null || \
          cargo install --git https://github.com/noir-lang/noir.git nargo_cli --locked 2>&1
          echo "nargo installed: $(nargo --version 2>/dev/null || echo 'failed')"

      - name: Compile Noir circuit
        if: ${{ !inputs.skip_noir }}
        continue-on-error: true
        run: |
          cd circuits
          nargo compile 2>&1 || echo "Compilation may need version compatibility"
          find target/ -type f -ls 2>/dev/null || true
          mkdir -p $GITHUB_WORKSPACE/dist/wasm
          find target/ -name "*.wasm" -exec cp {} $GITHUB_WORKSPACE/dist/wasm/ \; 2>/dev/null || true

      # ── Accept pre-compiled WASM upload ────────────────
      - name: Check for pre-compiled WASM in repo
        run: |
          if [ -d deploy/wasm ] && [ "$(ls -A deploy/wasm/ 2>/dev/null)" ]; then
            echo "Found pre-compiled WASM in deploy/wasm/"
            mkdir -p dist/wasm
            cp deploy/wasm/*.wasm dist/wasm/ 2>/dev/null || true
            ls -la deploy/wasm/
          fi

      # ── Package ────────────────────────────────────────
      - name: Package artifacts
        run: |
          mkdir -p dist/wasm
          echo "=== Final artifacts ==="
          find dist/ -type f -ls 2>/dev/null || echo "No WASM artifacts built"
          echo "---"
          echo "Artifacts:" > dist/MANIFEST.txt
          find dist/ -type f >> dist/MANIFEST.txt 2>/dev/null

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-modules
          path: dist/
          retention-days: 30

      # ── Deploy workers (optional) ──────────────────────
      - name: Deploy to Cloudflare Workers
        if: ${{ inputs.deploy_to_cf }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          for WORKER in wasm-edge-compute zkp-verification; do
            curl -sS --fail -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/$WORKER" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/javascript" \
              --data-binary @"workers/$WORKER/src/index.js" && echo " ✓ $WORKER"
          done
