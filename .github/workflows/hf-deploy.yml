name: Deploy ZeroClaw to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - 'deploy/huggingface-space/**'
      - '.github/workflows/hf-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Hugging Face Hub
        run: pip install -q huggingface-hub

      - name: Push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -c "
from huggingface_hub import HfApi
api = HfApi(token='${{ secrets.HF_TOKEN }}')
api.upload_folder(
    folder_path='deploy/huggingface-space',
    repo_id='XMRTDAO/zero-claw',
    repo_type='space'
)
print('✅ Deployed to XMRTDAO/zero-claw')
"

      - name: Verify Deployment
        run: |
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://huggingface.co/spaces/XMRTDAO/zero-claw)
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ]; then
            echo "✅ Space is live (HTTP $STATUS)"
          else
            echo "⚠️ Space returned HTTP $STATUS — may still be building"
          fi
