<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ED1C24"/>
      <stop offset="100%" stop-color="#ff4d4d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ED1C24"/>
    </marker>
  </defs>

  <rect width="900" height="500" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="22" font-weight="700" letter-spacing="1">ZERO-CLAW</text>
  <text x="450" y="68" text-anchor="middle" fill="#ED1C24" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500" letter-spacing="3">ZK GOVERNANCE PIPELINE</text>

  <!-- Pipeline Steps -->
  <!-- Step 1: Proposal -->
  <rect x="60" y="110" width="140" height="90" fill="url(#card)" stroke="#2a2a2a" stroke-width="1.5" rx="10"/>
  <rect x="60" y="110" width="140" height="3" fill="url(#accent)" rx="1.5"/>
  <text x="130" y="145" text-anchor="middle" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">PROPOSAL</text>
  <text x="130" y="165" text-anchor="middle" fill="#aaaaaa" font-family="JetBrains Mono, monospace" font-size="9">DAO members submit</text>
  <text x="130" y="180" text-anchor="middle" fill="#aaaaaa" font-family="JetBrains Mono, monospace" font-size="9">governance action</text>

  <!-- Arrow 1 -->
  <line x1="200" y1="155" x2="240" y2="155" stroke="#ED1C24" stroke-width="2" marker-end="url(#arrow)" opacity="0.8"/>

  <!-- Step 2: ZK Circuit Gen -->
  <rect x="250" y="110" width="140" height="90" fill="url(#card)" stroke="#2a2a2a" stroke-width="1.5" rx="10"/>
  <rect x="250" y="110" width="140" height="3" fill="url(#accent)" rx="1.5"/>
  <text x="320" y="145" text-anchor="middle" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">CIRCUIT GEN</text>
  <text x="320" y="165" text-anchor="middle" fill="#aaaaaa" font-family="JetBrains Mono, monospace" font-size="9">Compile proposal into</text>
  <text x="320" y="180" text-anchor="middle" fill="#aaaaaa" font-family="JetBrains Mono, monospace" font-size="9">ZK constraint system</text>

  <!-- Arrow 2 -->
  <line x1="390" y1="155" x2="430" y2="155" stroke="#ED1C24" stroke-width="2" marker-end="url(#arrow)" opacity="0.8"/>

  <!-- Step 3: Proof Generation -->
  <rect x="440" y="110" width="140" height="90" fill="url(#card)" stroke="#2a2a2a" stroke-width="1.5" rx="10"/>
  <rect x="440" y="110" width="140" height="3" fill="url(#accent)" rx="1.5"/>
  <text x="510" y="145" text-anchor="middle" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">PROOF GEN</text>
  <text x="510" y="165" text-anchor="middle" fill="#aaaaaa" font-family="JetBrains Mono, monospace" font-size="9">Generate SNARK proof</text>
  <text x="510" y="180" text-anchor="middle" fill="#aaaaaa" font-family="JetBrains Mono, monospace" font-size="9">on AMD EPYC / ROCm</text>

  <!-- Arrow 3 -->
  <line x1="580" y1="155" x2="620" y2="155" stroke="#ED1C24" stroke-width="2" marker-end="url(#arrow)" opacity="0.8"/>

  <!-- Step 4: On-chain Verify -->
  <rect x="630" y="110" width="140" height="90" fill="url(#card)" stroke="#2a2a2a" stroke-width="1.5" rx="10"/>
  <rect x="630" y="110" width="140" height="3" fill="url(#accent)" rx="1.5"/>
  <text x="700" y="145" text-anchor="middle" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">VERIFY</text>
  <text x="700" y="165" text-anchor="middle" fill="#aaaaaa" font-family="JetBrains Mono, monospace" font-size="9">Smart contract verifies</text>
  <text x="700" y="180" text-anchor="middle" fill="#aaaaaa" font-family="JetBrains Mono, monospace" font-size="9">proof on-chain</text>

  <!-- Arrow 4 -->
  <line x1="700" y1="200" x2="700" y2="240" stroke="#ED1C24" stroke-width="2" marker-end="url(#arrow)" opacity="0.8"/>

  <!-- Step 5: Execution -->
  <rect x="360" y="260" width="180" height="80" fill="url(#card)" stroke="#ED1C24" stroke-width="1.5" rx="10" filter="url(#glow)"/>
  <rect x="360" y="260" width="180" height="3" fill="url(#accent)" rx="1.5"/>
  <text x="450" y="295" text-anchor="middle" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">EXECUTION</text>
  <text x="450" y="318" text-anchor="middle" fill="#ED1C24" font-family="JetBrains Mono, monospace" font-size="10" font-weight="500">Governance action executed</text>

  <!-- Bottom Metrics -->
  <rect x="80" y="380" width="200" height="70" fill="#111" stroke="#2a2a2a" stroke-width="1" rx="8"/>
  <text x="180" y="410" text-anchor="middle" fill="#ED1C24" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">&lt; 2s</text>
  <text x="180" y="430" text-anchor="middle" fill="#888888" font-family="JetBrains Mono, monospace" font-size="10">PROOF GENERATION</text>

  <rect x="310" y="380" width="200" height="70" fill="#111" stroke="#2a2a2a" stroke-width="1" rx="8"/>
  <text x="410" y="410" text-anchor="middle" fill="#ED1C24" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">99.9%</text>
  <text x="410" y="430" text-anchor="middle" fill="#888888" font-family="JetBrains Mono, monospace" font-size="10">VERIFICATION RATE</text>

  <rect x="540" y="380" width="200" height="70" fill="#111" stroke="#2a2a2a" stroke-width="1" rx="8"/>
  <text x="640" y="410" text-anchor="middle" fill="#ED1C24" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">ZERO</text>
  <text x="640" y="430" text-anchor="middle" fill="#888888" font-family="JetBrains Mono, monospace" font-size="10">TRUSTED SETUP</text>

  <!-- Footer -->
  <text x="450" y="480" text-anchor="middle" fill="#444" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="1">AMD EPYC + ROCm ACCELERATED | XMRT DAO</text>
</svg>